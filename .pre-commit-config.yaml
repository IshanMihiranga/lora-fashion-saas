# Lora Fashions — pre-commit hooks
#   python -m pip install --user pre-commit
#   pre-commit install
#   pre-commit run --all-files
#
# Prettier and ESLint are added in Part 0.4.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # Secret scanning — blocks commits that contain credentials.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # File hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(cmd|bat|ps1)$'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Java formatting (Google Java Format via Spotless). Fix with: cd backend && ./mvnw spotless:apply
  - repo: local
    hooks:
      - id: spotless-check
        name: spotless (backend Java format)
        language: system
        entry: sh -c 'cd backend && ./mvnw -B -q spotless:check'
        files: ^backend/.*\.java$
        pass_filenames: false
